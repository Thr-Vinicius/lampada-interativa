<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Controle - Lâmpada</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="painel-container">
    <section class="card-dispositivo">
      <h1>Painel de Controle</h1>
      <p>Controle o sistema da lâmpada interativa.</p>

      <img
        id="lampada-visual"
        class="lampada-img"
        src="img/lampada-apagada.png"
        alt="Lâmpada Apagada"
      >

      <button id="btn-acao" class="btn-controle">
        Ligar Lâmpada
      </button>
    </section>

    <section class="card-dispositivo">
      <h2>Status</h2>
      <p>Sistema Operacional</p>

      <div id="status-sistema" class="status desligado">
        OFF
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
